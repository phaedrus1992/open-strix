name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - run: uv sync --dev --locked
      # A bare pytest from the root collides with the tests package in optional-skills.
      - run: uv run pytest tests/ -q
      - run: uv run --project ../.. pytest tests -q
        working-directory: optional-skills/chainlink-worker

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - run: uv sync --dev --locked
      - run: uvx ruff@0.16.10 check open_strix/robo tests/robo
      - run: uvx ruff@0.16.10 format --check open_strix/robo tests/robo
      - run: uv run --with ty==0.0.85 ty check open_strix/robo tests/robo

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      # Upstream release workflows are disabled in this fork and keep upstream style (FORK.md, #7).
      - run: uvx --from actionlint-py==1.7.12.25 actionlint .github/workflows/ci.yml
      - run: uvx zizmor==1.30.1 --persona=regular .github/workflows/ci.yml
